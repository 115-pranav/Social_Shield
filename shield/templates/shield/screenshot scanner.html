<!DOCTYPE html>
<html>
<head>
    <title>Screenshot Scanner - Social Shield</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
        }

        #preview {
            max-width: 100%;
            max-height: 350px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🖼️ Screenshot Scanner</h1>

    <p>
        Upload a screenshot for Social Shield to inspect.
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <input
            type="file"
            name="screenshot"
            id="screenshot"
            accept="image/*"
            required
        >

        <img id="preview">

        <button type="submit">
            🔍 Scan Screenshot
        </button>

    </form>

    {% if result %}
    <div class="result">

        <h2>Scan Result</h2>

        <p>
            <strong>Risk:</strong> {{ result.risk }}
        </p>

        <p>
            {{ result.message }}
        </p>

    </div>
    {% endif %}

</div>

<script>
const input = document.getElementById("screenshot");
const preview = document.getElementById("preview");

input.addEventListener("change", function () {

    const file = this.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

});
</script>

</body>
</html>
