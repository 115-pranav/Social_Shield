{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Shield - Analyzer</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1f2937
}

.topbar{
    background:#111827;
    color:#fff;
    padding:18px 45px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.logo{
    font-size:24px;
    font-weight:700
}

.nav a{
    color:#fff;
    text-decoration:none;
    margin-left:22px;
    font-size:14px
}

.nav a:hover{
    color:#93c5fd
}

.page{
    width:92%;
    max-width:950px;
    margin:42px auto
}

.back{
    display:inline-block;
    color:#2563eb;
    text-decoration:none;
    font-weight:700;
    margin-bottom:20px
}

.card{
    background:#fff;
    border-radius:18px;
    padding:32px;
    box-shadow:0 8px 25px rgba(0,0,0,.08)
}

h1{
    margin:0 0 10px;
    font-size:34px
}

.intro{
    color:#6b7280;
    margin-bottom:28px
}


/* =========================
   ANALYZER TABS
========================= */

.analyzer-tabs{
    display:flex;
    gap:12px;
    margin-bottom:28px;
    border-bottom:1px solid #e5e7eb;
    padding-bottom:14px;
}

.analyzer-tab{
    display:inline-block;
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
}

.message-tab{
    background:#2563eb;
    color:white;
}

.qr-tab{
    background:#f3f4f6;
    color:#111827;
    border:1px solid #d1d5db;
}

.qr-tab:hover{
    background:#e5e7eb;
}


/* =========================
   MESSAGE ANALYZER
========================= */

.label{
    font-weight:700;
    display:block;
    margin-bottom:10px
}

.message{
    width:100%;
    min-height:220px;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    resize:vertical;
    outline:none
}

.message:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1)
}

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:15px
}

.count{
    color:#6b7280;
    font-size:14px
}

.button{
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    padding:13px 22px;
    font-weight:700;
    font-size:15px;
    cursor:pointer
}

.button:hover{
    background:#1d4ed8
}

.button:disabled{
    opacity:.65;
    cursor:not-allowed
}


/* =========================
   RESULT
========================= */

.result{
    margin-top:28px;
    border-radius:15px;
    padding:25px;
    background:#f8fafc;
    border:1px solid #e5e7eb
}

.result h2{
    margin-top:0
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px
}

.metric{
    background:#fff;
    border-radius:12px;
    padding:16px;
    border:1px solid #e5e7eb
}

.metric strong{
    display:block;
    color:#6b7280;
    font-size:13px;
    margin-bottom:7px
}

.metric span{
    font-size:21px;
    font-weight:700
}

.warning{
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#fff7ed;
    color:#9a3412
}

.hidden{
    display:none
}

.status{
    font-weight:700;
    margin-bottom:15px
}

.new{
    margin-top:20px;
    background:#111827
}

.new:hover{
    background:#1f2937
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .topbar{
        padding:16px 20px;
        flex-direction:column;
        gap:12px
    }

    .nav a{
        margin:0 7px
    }

    .page{
        width:94%;
        margin:25px auto
    }

    .card{
        padding:22px
    }

    h1{
        font-size:28px
    }

    .grid{
        grid-template-columns:1fr
    }

    .bottom{
        flex-direction:column;
        align-items:stretch
    }

    .button{
        width:100%
    }

    .analyzer-tabs{
        flex-direction:column
    }

    .analyzer-tab{
        text-align:center
    }
}

</style>

</head>

<body>

<header class="topbar">

```
<div class="logo">
    🛡️ Social Shield
</div>

<nav class="nav">

    <a href="/">Home</a>

    <a href="/dashboard/">
        Dashboard
    </a>

    <a href="/history/">
        History
    </a>

    <a href="/logout/">
        Logout
    </a>

</nav>
```

</header>

<main class="page">

```
<a
    class="back"
    href="/dashboard/">

    ← Back to Dashboard

</a>


<div class="card">

    <h1>
        🔍 Social Shield Analyzer
    </h1>

    <p class="intro">
        Analyze suspicious messages or scan QR codes
        for potential cybersecurity threats.
    </p>


    <!-- =========================
         ANALYZER TABS
    ========================== -->

    <div class="analyzer-tabs">

        <a
            href="/analyze/"
            class="analyzer-tab message-tab">

            💬 Analyze Message

        </a>


        <a
            href="/qr-scanner/"
            class="analyzer-tab qr-tab">

            📷 Scan QR Code

        </a>

    </div>


    <!-- =========================
         MESSAGE ANALYZER
    ========================== -->

    <label
        class="label"
        for="messageInput">

        Message to analyze

    </label>


    <textarea
        id="messageInput"
        class="message"
        maxlength="1000"
        placeholder="Example: Congratulations! You won a free prize. Click this link now."></textarea>


    <div class="bottom">

        <span
            id="charCount"
            class="count">

            0 / 1000

        </span>


        <button
            id="analyzeBtn"
            class="button">

            🔍 Analyze Message

        </button>

    </div>


    <!-- =========================
         RESULT
    ========================== -->

    <div
        id="resultBox"
        class="result hidden">
```
