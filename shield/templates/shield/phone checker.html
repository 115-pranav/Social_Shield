<!DOCTYPE html>
<html>
<head>
    <title>Phone Checker - Social Shield</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📱 Phone Checker</h1>

    <p>
        Check the basic format of a phone number.
    </p>

    <form method="POST">
        {% csrf_token %}

        <input
            type="tel"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <button type="submit">
            🔍 Check Phone
        </button>
    </form>

    {% if result %}
    <div class="result">

        <h2>{{ result.status }}</h2>

        <p>
            <strong>Risk:</strong> {{ result.risk }}
        </p>

        <p>
            {{ result.message }}
        </p>

    </div>
    {% endif %}

</div>

</body>
</html>
