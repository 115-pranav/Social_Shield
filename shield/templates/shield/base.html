<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Social Shield{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .page-content {
            min-height: 100vh;
        }

        /* =========================
           AI CHATBOT BUTTON
        ========================= */

        .chatbot-button {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: none;
            background: #111827;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            transition: transform 0.2s ease;
        }

        .chatbot-button:hover {
            transform: scale(1.08);
        }

        /* =========================
           CHATBOT WINDOW
        ========================= */

        .chatbot-window {
            display: none;
            position: fixed;
            right: 25px;
            bottom: 100px;
            width: 350px;
            height: 470px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            z-index: 9998;
        }

        .chatbot-header {
            background: #111827;
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chatbot-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .chatbot-status {
            font-size: 11px;
            opacity: 0.75;
            margin-top: 3px;
        }

        .chatbot-close {
            border: none;
            background: transparent;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        /* =========================
           CHAT MESSAGES
        ========================= */

        .chatbot-messages {
            height: 350px;
            padding: 15px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .bot-message,
        .user-message {
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .bot-message {
            background: #e5e7eb;
            color: #111827;
            margin-right: auto;
        }

        .user-message {
            background: #dbeafe;
            color: #111827;
            margin-left: auto;
        }

        .typing-message {
            font-style: italic;
            opacity: 0.7;
        }

        /* =========================
           INPUT AREA
        ========================= */

        .chatbot-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .chatbot-input {
            flex: 1;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .chatbot-input:focus {
            border-color: #111827;
        }

        .chatbot-send {
            margin-left: 8px;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .chatbot-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .chatbot-window {
                right: 10px;
                bottom: 90px;
                width: calc(100% - 20px);
                height: 470px;
            }

            .chatbot-button {
                right: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="page-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- =================================
         DJANGO CSRF TOKEN
    ================================== -->

    <form style="display:none;">
        {% csrf_token %}
    </form>


    <!-- =================================
         AI CHATBOT BUTTON
    ================================== -->

    <button
        class="chatbot-button"
        id="chatbotButton"
        onclick="toggleChatbot()"
        aria-label="Open Social Shield AI Assistant">

        🤖

    </button>


    <!-- =================================
         AI CHATBOT WINDOW
    ================================== -->

    <div
        class="chatbot-window"
        id="chatbotWindow">

        <!-- HEADER -->

        <div class="chatbot-header">

            <div>

                <h3>🤖 Social Shield AI</h3>

                <div class="chatbot-status">
                    ● Online
                </div>

            </div>

            <button
                class="chatbot-close"
                onclick="toggleChatbot()"
                aria-label="Close chatbot">

                ×

            </button>

        </div>


        <!-- MESSAGES -->

        <div
            class="chatbot-messages"
            id="chatbotMessages">

            <div class="bot-message">

                👋 Hello! I'm the Social Shield AI Assistant.

                <br><br>

                I can help with:

                <br>🛡️ Phishing
                <br>📩 Spam
                <br>⚠️ Suspicious messages
                <br>🔐 OTP and password safety
                <br>🌐 Cybersecurity

            </div>

        </div>


        <!-- INPUT -->

        <div class="chatbot-input-area">

            <input
                type="text"
                id="chatbotInput"
                class="chatbot-input"
                placeholder="Ask about a cyber threat..."
                autocomplete="off"
                onkeydown="if(event.key === 'Enter') sendChatMessage()">

            <button
                class="chatbot-send"
                id="chatbotSend"
                onclick="sendChatMessage()">

                ➤

            </button>

        </div>

    </div>


    <!-- =================================
         CHATBOT JAVASCRIPT
    ================================== -->

    <script>

        function toggleChatbot() {

            const chatbot =
                document.getElementById("chatbotWindow");

            if (chatbot.style.display === "block") {

                chatbot.style.display = "none";

            } else {

                chatbot.style.display = "block";

                setTimeout(function () {

                    document
                        .getElementById("chatbotInput")
                        .focus();

                }, 100);

            }
        }


        function getCSRFToken() {

            const csrfInput =
                document.querySelector(
                    'input[name="csrfmiddlewaretoken"]'
                );

            if (csrfInput) {

                return csrfInput.value;

            }

            return "";

        }


        async function sendChatMessage() {

            const input =
                document.getElementById("chatbotInput");

            const messages =
                document.getElementById("chatbotMessages");

            const sendButton =
                document.getElementById("chatbotSend");

            const message =
                input.value.trim();


            if (message === "") {

                return;

            }


            /* USER MESSAGE */

            const userMessage =
                document.createElement("div");

            userMessage.className =
                "user-message";

            userMessage.textContent =
                message;

            messages.appendChild(userMessage);


            input.value = "";

            input.disabled = true;

            sendButton.disabled = true;


            /* THINKING MESSAGE */

            const thinkingMessage =
                document.createElement("div");

            thinkingMessage.className =
                "bot-message typing-message";

            thinkingMessage.textContent =
                "🤖 Thinking...";

            messages.appendChild(thinkingMessage);


            messages.scrollTop =
                messages.scrollHeight;


            try {

                const response =
                    await fetch("/chatbot/", {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded",

                            "X-CSRFToken":
                                getCSRFToken()

                        },

                        body:
                            new URLSearchParams({

                                message: message

                            })

                    });


                const data =
                    await response.json();


                thinkingMessage.remove();


                /* SERVER ERROR */

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to contact the assistant."
                    );

                }


                /* BOT RESPONSE */

                const botMessage =
                    document.createElement("div");

                botMessage.className =
                    "bot-message";

                botMessage.textContent =
                    data.answer ||
                    "Sorry, I could not generate a response.";


                messages.appendChild(botMessage);


            } catch (error) {

                thinkingMessage.remove();


                const errorMessage =
                    document.createElement("div");

                errorMessage.className =
                    "bot-message";

                errorMessage.textContent =
                    "⚠️ " +
                    (error.message ||
                    "Something went wrong. Please try again.");


                messages.appendChild(errorMessage);

            }


            input.disabled = false;

            sendButton.disabled = false;

            input.focus();


            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>


</body>
</html>
